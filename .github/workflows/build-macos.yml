name: Build macOS

# Builds the AgentBetta .app / .zip / .dmg for Apple silicon and Intel. On a v*
# tag it also publishes a GitHub Release with the assets the in-app updater
# downloads. Run manually from the Actions tab (workflow_dispatch), or push a
# v* tag.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14   # Apple silicon (arm64)
            arch: arm64
          - runner: macos-13   # Intel (x86_64)
            arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop,browser,build]"
          pip install pillow pytest

      - name: Install Playwright Chromium (browser fallback)
        run: python -m playwright install chromium

      - name: Run test suite
        run: python -m pytest -q

      - name: Build .app / .zip / .dmg
        run: bash scripts/build_macos.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AgentBetta-macOS-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/macos/**/*.zip
            release/macos/**/*.dmg
            release/macos/**/SHA256SUMS.txt

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          fail_on_unmatched_files: false
          generate_release_notes: true
