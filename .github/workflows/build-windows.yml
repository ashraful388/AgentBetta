name: Build Windows

# Builds the AgentBetta Windows Setup EXE + portable ZIP from the windows/ folder.
# On a v* tag it also publishes a GitHub Release with the installer assets.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

defaults:
  run:
    working-directory: windows

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $expected = ("${{ github.ref_name }}").TrimStart([char]"v")
          $pepExpected = $expected -replace '-alpha\.', 'a'
          $pyproject = [regex]::Match((Get-Content -Raw pyproject.toml), '(?m)^version = "([^"]+)"\r?$').Groups[1].Value
          $runtime = [regex]::Match((Get-Content -Raw src/agentbetta/__init__.py), '(?m)^__version__ = "([^"]+)"\r?$').Groups[1].Value
          $build = [regex]::Match((Get-Content -Raw scripts/build_windows.ps1), '(?m)^\$version = "([^"]+)"\r?$').Groups[1].Value
          $installer = [regex]::Match((Get-Content -Raw packaging/agentbetta.iss), '(?m)^#define MyAppVersion "([^"]+)"\r?$').Groups[1].Value
          if ($pyproject -ne $pepExpected -or $runtime -ne $pepExpected -or $build -ne $expected -or $installer -ne $expected) {
            throw "Version mismatch: tag=$expected pyproject=$pyproject runtime=$runtime build=$build installer=$installer"
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Create virtual environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[desktop,browser,http,build]"
          .\.venv\Scripts\python.exe -m pip install pillow pytest

      - name: Install Playwright Chromium (browser fallback)
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m playwright install chromium

      - name: Build (tests, PyInstaller, Inno Setup, hashes)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\build_windows.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AgentBetta-Windows-x64
          if-no-files-found: error
          path: |
            windows/release/windows/**/*.exe
            windows/release/windows/**/*.zip
            windows/release/windows/**/SHA256SUMS-Windows.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows/release/windows/**/AgentBetta-*-Setup.exe
            windows/release/windows/**/AgentBetta-*-Portable.zip
            windows/release/windows/**/SHA256SUMS-Windows.txt
          fail_on_unmatched_files: false
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.ref_name, '-dev') }}
